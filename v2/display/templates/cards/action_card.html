<article class="display-card action_card action-card" data-card-type="action_card" data-template="action-card-template">
  <header class="action-card__hero">
    <div class="action-card__identity">
      <span class="action-card__title">{{ title }}</span>
      <small class="action-card__code">{{ subtitle }}</small>
      <div class="display-card__badges action-card__badges">{{ badges }}</div>
    </div>
    <div class="action-card__score">
      <span>评分</span>
      <strong>{{ score }}</strong>
    </div>
  </header>
  <div class="action-card__risk-strip">{{ risks }}</div>
  <div class="display-card__body action-card__body action-card__grid action-card__details">{{ body }}</div>
</article>
