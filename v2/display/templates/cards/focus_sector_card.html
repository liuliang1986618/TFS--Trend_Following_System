<article class="display-card focus-sector-card" data-card-type="focus_sector_card" data-template="focus-sector-card-template">
  <header class="display-card__header">
    <span class="display-card__title">{{ title }}</span>
    <small class="display-card__code">{{ subtitle }}</small>
    <span class="display-card__score">{{ score }}</span>
  </header>
  <div class="display-card__badges">{{ badges }}</div>
  <div class="display-card__body focus-sector-card__body">{{ body }}</div>
</article>
