<article class="display-card funnel-deep-dive-card" data-card-type="funnel_deep_dive_card" data-template="funnel-deep-dive-card-template">
  <header class="display-card__header">
    <span class="display-card__title">{{ title }}</span>
    <small class="display-card__code">{{ subtitle }}</small>
    <span class="display-card__score">{{ score }}</span>
  </header>
  <div class="display-card__badges">{{ badges }}</div>
  <div class="display-card__body funnel-deep-dive-card__body">{{ body }}</div>
</article>
