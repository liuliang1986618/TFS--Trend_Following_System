<article class="display-card sector-focus-card" data-card-type="sector_focus_card" data-template="sector-focus-card-template">
  <header class="sector-focus-card__header">
    <div>
      <span>{{ title }}</span>
      <small>{{ subtitle }}</small>
    </div>
    <strong>{{ score }}</strong>
  </header>
  <div class="display-card__badges">{{ badges }}</div>
  <div class="sector-focus-card__body">{{ body }}</div>
</article>
