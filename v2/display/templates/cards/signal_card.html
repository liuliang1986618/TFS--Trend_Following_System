<article class="display-card signal-card" data-card-type="signal_card">
  <header class="signal-card__header">
    <div>
      <span>{{ title }}</span>
      <small>{{ subtitle }}</small>
    </div>
    <strong>{{ score }}</strong>
  </header>
  <div class="display-card__badges">{{ badges }}</div>
  <div class="signal-card__body">{{ body }}</div>
</article>
